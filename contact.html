<style> 
	root
	{
		--backgroundimage: <img src="images\stars.jpg" alt="starry background";>
		--headerimage: <img src="images\header.png" alt="header image" style="max-width:100%;height:auto;">
	}
    * 
    {
        box-sizing: border-box;
    }

    #container 
    {
        max-width: 900px;
                /* this is the width of your layout! */
                /* if you change the above value, scroll to the bottom
      and change the media query according to the comment! */
        margin: 0 auto;
                /* this centers the entire page */
    }
	
	main
    {
        background-color: #EA8AA9;
        flex: 1; 
        padding: 20px; 
        order: 2; 
    }
	
	aside 
    {
        background-color: #5e4e8c;
        float: left;
        max-width: 200px;
        padding: 20px; 
        font-size: smaller;
        order: 3; 
    }
	
	ul.sidenav 
	{
		list-style-type: none;
		margin: 0;
		padding: 0;
		width: 15%;
		background-color: #5e4e8c;
		position: fixed;
		height: 100%;
		overflow: auto;
	}

	ul.sidenav li a 
	{
		display: block;
		color: #ffffff;
		padding: 8px 16px;
		text-decoration: none;
	}
 
	ul.sidenav li a.active 
	{
		background-color: #acecb5;
		color: rgb(1, 73, 17);
	}

	ul.sidenav li a:hover:not(.active) 
	{
		background-color: #fabff2;
		color: rgb(0, 0, 0);
	}
	
	iframe
	{
		display: block;
		margin-left: auto;
		margin-right: auto;
	}
	



    @media only screen and (max-width: 900px)
    {
        #flex 
        {
            flex-wrap: wrap;
        }
		.headerImage
		{
			position: relative; 
			top:0;
		}
        
        ul.sidenav 
        {
            width: 100%;
            height: auto;
            position: relative;
        }
  
        ul.sidenav li a 
        {
            float: left;
            padding: 15px;
        }

        main 
        {
            order: 2;
        }
        #leftSidebar
        {
            order:3; 
        }
        #header
        {
            order:1;
        }
		img
		{
			max-width: 100%
			height: auto; 
		}
		iframe
		{
			max-width: 100%; 
			max-height: 100%; 
		}
	}	

    
@media screen and (max-width: 400px) 
{
